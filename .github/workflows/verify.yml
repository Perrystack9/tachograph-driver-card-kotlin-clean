name: Library verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fresh checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check sources and Android SDK
        run: |
          sha256sum --check SHA256SUMS
          python3 tools/audit-release.py
          git fsck --full --strict
          python3 tools/audit-key-material.py --git-objects
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Build, test, lint and publish to isolated local Maven
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 \
            -Dmaven.repo.local="$RUNNER_TEMP/driver-card-maven" \
            :card-core:test :card-usb-android:testReleaseUnitTest \
            :card-usb-android:assembleRelease :card-usb-android:lintRelease \
            :card-core:publishToMavenLocal :card-usb-android:publishToMavenLocal
      - name: Build and test the independent Maven consumer
        working-directory: examples/android-consumer
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 \
            -Dmaven.repo.local="$RUNNER_TEMP/driver-card-maven" \
            :app:assembleDebug :app:testDebugUnitTest :app:lintDebug \
            :app:integrationDependencies
      - name: Record test counts and verify Maven metadata
        run: |
          python3 tools/audit-key-material.py "$RUNNER_TEMP/driver-card-maven"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          rows = []
          for label, directory, expected in [
              ("Core JVM", "card-core/build/test-results/test", 455),
              ("USB module JVM", "card-usb-android/build/test-results/testReleaseUnitTest", 4),
              ("Independent consumer JVM", "examples/android-consumer/app/build/test-results/testDebugUnitTest", 7),
          ]:
              suites = [ET.parse(p).getroot() for p in Path(directory).glob("TEST-*.xml")]
              totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "failures", "errors", "skipped")}
              assert totals == {"tests": expected, "failures": 0, "errors": 0, "skipped": 0}, (label, totals)
              rows.append(f"| {label} | {expected} passed; 0 skipped |")
          for label, report in [
              ("Library lint", "card-usb-android/build/reports/lint-results-release.xml"),
              ("Consumer lint", "examples/android-consumer/app/build/reports/lint-results-debug.xml"),
          ]:
              issues = ET.parse(report).getroot().findall("issue")
              errors = sum(i.get("severity") in ("Error", "Fatal") for i in issues)
              warnings = sum(i.get("severity") == "Warning" for i in issues)
              assert errors == 0, (label, errors)
              rows.append(f"| {label} | {errors} errors; {warnings} warnings |")
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          for module, extension in [("card-core", "jar"), ("card-usb-android", "aar")]:
              directory = Path(os.environ["RUNNER_TEMP"]) / "driver-card-maven/de/fahrertagebuch" / module / "0.1.0"
              stem = module + "-0.1.0"
              pom = ET.parse(directory / (stem + ".pom")).getroot()
              assert pom.findtext("m:url", namespaces=ns) == "https://github.com/Perrystack9/tachograph-driver-card-kotlin-clean"
              assert "Apache License, Version 2.0" in pom.findtext("m:licenses/m:license/m:name", namespaces=ns)
              for suffix in [".pom", ".module", "-sources.jar", "." + extension]:
                  assert (directory / (stem + suffix)).is_file(), suffix
              rows.append(f"| {module} | local artifact, sources, POM and module metadata verified |")
          summary = "# Library verification\n\n| Check | Result |\n| --- | --- |\n" + "\n".join(rows) + "\n\nNo hardware, emulator, public release or certificate-trust validation.\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(summary)
          PY

