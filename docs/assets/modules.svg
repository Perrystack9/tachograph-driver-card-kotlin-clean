<title id="title">Module boundaries</title><desc id="desc">Your Android application depends on card-usb-android, which exposes card-core. Your app owns permissions and lifecycle. USB transport handles CCID and APDU I/O. The core decodes EF bytes and checks signature mathematics without evaluating certificate trust.</desc>
