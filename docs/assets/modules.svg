<g fill="#ffad66" font-size="12" font-weight="700"><text x="49" y="86">HOST APPLICATION</text><text x="429" y="86">ANDROID · API 26+</text><text x="809" y="86">KOTLIN / JVM · JAVA 17</text></g>
<g fill="#f5f2e9" font-size="22" font-weight="700"><text x="49" y="124">Your Android app</text><text x="429" y="124">card-usb-android</text><text x="809" y="124">card-core</text></g>
<g fill="#b4cbdc" font-size="14"><text x="49" y="163">USB permission and lifecycle</text><text x="49" y="188">Storage and presentation</text><text x="429" y="163">USB Host CCID transport</text><text x="429" y="188">APDU exchange and diagnostics</text><text x="809" y="163">EF decoding and card reading</text><text x="809" y="188">Signature mathematics</text></g>
<text x="28" y="255" fill="#9ab8cf" font-size="13">EF contents, not a complete DDD container. Certificate trust: NOT_EVALUATED.</text>
